# See architecture/standards/go-elemental/principles/release-and-ci.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

[env]
GO_MODULES = ". postgres postgres/pgvector sqlint"
SQLATE_DSN = "postgres://app:app@127.0.0.1:{{ get_env(name='POSTGRES_PORT', default='5433') }}/app?sslmode=disable"
HOLDS = '''
'''

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then sqlint the repository under the committed go.work, through which it resolves the modules sqlint.toml names, then run lint-context and lint-references; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT"
env -u GOWORK go run github.com/standards-lab/sqlate/sqlint/cmd/sqlint .
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
exit "$fail"
'''

[tasks.currency]
description = "Report every mise tool, Go version, requirement, action pin, image tag, and Dockerfile source ARG behind its latest, a held one with its reason; writes nothing"
run = "scripts/currency.sh report"

[tasks.upgrade]
description = "Bump the mise tools, then each module's go directive (to the current Go minor, with no toolchain line) and direct requirements, with a tidy, then the action pins, image tags, Dockerfile FROM tags, and Dockerfile source ARGs, to their latest, but a held one; rewrites mise.toml, go.mod, go.sum, the workflows, and the compose files"
run = "scripts/currency.sh upgrade"

[tasks.tidy]
description = "Run go mod tidy across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> tidy: $mod"
  (cd "$mod" && go mod tidy)
done
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.lint]
description = "Run golangci-lint across all modules, then sqlint over the repository"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> lint: $mod"
  (cd "$mod" && golangci-lint run ./...)
done
echo "==> sqlint"
go run github.com/standards-lab/sqlate/sqlint/cmd/sqlint .
'''

[tasks.build]
description = "Build each module with the workspace off, proving it resolves its own pins standalone"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> build (GOWORK=off): $mod"
  (cd "$mod" && GOWORK=off go build ./...)
done
'''

[tasks.vet]
description = "Run go vet across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> vet: $mod"
  (cd "$mod" && go vet ./...)
done
'''

[tasks.test]
description = "Run the unit tier across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> test: $mod"
  (cd "$mod" && go test -race ./...)
done
'''

[tasks.integration]
description = "Run the integration tier of postgres and postgres/pgvector against the PostgreSQL named by SQLATE_DSN"
run = '''
set -e
for mod in postgres postgres/pgvector; do
  echo "==> integration: $mod"
  (cd "$mod" && go test -race -tags integration -count=1 ./...)
done
'''

[tasks.acceptance]
description = "The one-shot engine proof: db:up, integration, then db:reset regardless of the result, printing the stack's log on failure"
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs; mise run db:reset; exit $rc' EXIT
mise run db:up
mise run integration
'''

[tasks."db:up"]
description = "Build and start the compose PostgreSQL and wait until it is healthy"
run = "docker compose up -d --wait --build"

[tasks."db:down"]
description = "Stop the compose PostgreSQL, keeping its volume"
run = "docker compose down"

[tasks."db:reset"]
description = "Stop the compose PostgreSQL and drop its volume"
run = "docker compose down -v"
